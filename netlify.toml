# Netlify Configuration for Reflex Frontend
# Deploy: Connect repo at app.netlify.com → New site from Git

[build]
  # Build the Reflex frontend as static files
  command = "cd frontend/{usuk_frontend && reflex export --frontend-only"
  publish = "frontend/{usuk_frontend/.web/_static"

[build.environment]
  # Node version for any npm dependencies Reflex might need
  NODE_VERSION = "20"
  # Python version (Reflex uses Python to build)
  PYTHON_VERSION = "3.11"

# Environment variables (set in Netlify dashboard → Site settings → Environment variables)
# API_URL = "https://usuk-api.onrender.com"
# FRONTEND_URL = "https://usuk.netlify.app"

# Redirect rules for SPA (Reflex React app)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://usuk-api.onrender.com wss://usuk-api.onrender.com;"

# Cache static assets
[[headers]]
  for = "/_static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Functions (if you need any Netlify Functions later)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"