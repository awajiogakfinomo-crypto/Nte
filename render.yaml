# Render Blueprint - Deploys entire backend stack
# Connect repo at dashboard.render.com → New → Blueprint

services:
  # =========================================
  # MANAGED POSTGRESQL
  # =========================================
  - type: pserv
    name: nte-postgres
    plan: free  # free for 90 days, then $7/mo (starter)
    region: oregon  # or frankfurt for EU/Nigeria latency
    postgresMajorVersion: 16
    databaseName: nte
    user: nte
    # password: auto-generated (see env vars below)

  # =========================================
  # MANAGED REDIS
  # =========================================
  - type: redis
    name: nte-redis
    plan: free  # 25 MB free, then $7/mo for 100 MB
    region: oregon
    maxmemoryPolicy: allkeys-lru

  # =========================================
  # FASTAPI WEB SERVICE
  # =========================================
  - type: web
    name: nte-api
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free  # spins down after 15 min inactive; $7/mo for always-on
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nte-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nte-redis
          property: connectionString
      - key: POSTCODE_API_URL
        value: https://api.postcode.gov.ng
      - key: POSTCODE_API_KEY
        sync: false  # set in dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: CORS_ORIGINS
        value: https://nte.netlify.app,https://yourdomain.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
    # Run migrations on deploy
    preDeployCommand: alembic upgrade head
    # Start command (gunicorn with 2 workers for free tier memory)
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2

  # =========================================
  # CELERY WORKER (Background Worker)
  # =========================================
  - type: worker
    name: nte-celery-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: starter  # $7/mo — no free tier for workers
    region: oregon
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nte-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nte-redis
          property: connectionString
      - key: POSTCODE_API_URL
        value: https://api.postcode.gov.ng
      - key: POSTCODE_API_KEY
        sync: false
      - key: SECRET_KEY
        fromService:
          name: nte-api
          property: envVars.SECRET_KEY
      - key: ENVIRONMENT
        value: production
    startCommand: celery -A app.core.celery_app worker --loglevel=info --concurrency=2

  # =========================================
  # CELERY BEAT (Cron Job - runs every minute)
  # =========================================
  - type: cron
    name: nte-celery-beat
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    plan: free  # 100 runs/day free
    region: oregon
    schedule: "* * * * *"  # every minute
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nte-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: nte-redis
          property: connectionString
      - key: SECRET_KEY
        fromService:
          name: nte-api
          property: envVars.SECRET_KEY
      - key: ENVIRONMENT
        value: production
    startCommand: celery -A app.core.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler