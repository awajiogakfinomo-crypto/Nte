[project]
name = "nte"
version = "0.1.0"
description = "Nte - Nigerian Location Intelligence Platform powered by NIPOST Digital Postcode API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Backend
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "gunicorn==23.0.0",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "pydantic-extra-types==2.7.0",
    "sqlalchemy==2.0.30",
    "alembic==1.12.1",
    "asyncpg==0.29.0",
    "aiosqlite==0.19.0",
    "redis==5.0.1",
    "httpx==0.27.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",
    "loguru==0.7.2",
    "structlog==24.1.0",
    "pandas==2.2.2",
    "openpyxl==3.1.2",
    "email-validator==2.1.0.post1",
    "aiofiles==24.1.0",
    "tenacity==8.2.3",
    "orjson==3.10.3",
    "pendulum==3.0.0",
    # Frontend (Reflex)
    "reflex==0.6.2",
    # Testing
    "pytest==8.2.2",
    "pytest-asyncio==0.23.3",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "faker==24.10.1",
]

[project.optional-dependencies]
dev = [
    "black==24.4.2",
    "ruff==0.4.7",
    "mypy==1.10.0",
    "pre-commit==3.7.1",
    "ipython==8.25.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true